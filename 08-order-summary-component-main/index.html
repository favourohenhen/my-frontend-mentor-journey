<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Order summary card</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="main-body">
    <main class="main-container">
      <img src="./images/illustration-hero.svg" width="450px" class="main-img" />
      <section class="main-content">
        <section class="order-head">
          <h1 class="order-title">Order Summary</h1>
          <p class="order-subtitle">
            You can now listen to millions of songs, audiobooks, and podcasts on
            any device anywhere you like!
          </p>
        </section>
        <!--End of Order information-->
        <section class="content-plan">
          <section class="img-text">
             <img src="./images/icon-music.svg" alt="music icon" class="icon-music" />
          <section class="plan-text">
            <p class="annual-plan">Annual Plan</p>
            <p class="year">$59.99/year</p>
          </section>
          </section>
         
          <section class="change">
            <p class="change-plan">Change</p>
          </section>
        </section>
        <!--End of Content Plan-->
        <section class="buttons">
          <button type="button" class="proceed-button">
            Proceed to Payment
          </button>
          <section class="cancel-order">
             <p  class="cancel">Cancel Order</p>
          </section>
        </section>
       
      </section>
      <!--End of main content-->
    </main>
  </body>
</html>
