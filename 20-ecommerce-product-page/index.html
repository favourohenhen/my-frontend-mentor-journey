<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Sneakers | E-commerce Website</title>
    <link rel="stylesheet" href="./Stylesheets/styles.css" />
    
  </head>
  <body class="site-body">
    <header class="site-navigation">
      <!-- LEFT-NAVIGATION  -->
      <nav class="nav-lists">
        <div class="logo-toggle">
          <button
            type="button"
            class="nav-toggle"
            aria-label="Open Navigation"
            aria-expanded="false"
            onclick="toggleMenu()"
          >
            ☰
          </button>
          <a href="./index.html" class="home-link">
            <img src="./images/logo.svg" class="logo"><img>
          </a>
          
        </div>

        <ul class="list-items" id="nav-menu">
          <img src="./images/icon-close.svg" onclick="closeBtn()" class="closebtn" alt="">
          <li><a href="./collection.html">Collections</a></li>
          <li><a href="./men.html">Men</a></li>
          <li><a href="./women.html">Women</a></li>
          <li><a href="./about.html">About</a></li>
          <li><a href="./contact.html">Contact</a></li>
        </ul>
      </nav>
      <!-- RICHT-NAVIGATION  -->
      <section class="avatar-cart">
        <div class="cart-wrapper">
          <img src="./images/icon-cart.svg" class="cart-icon" />
          <span class="cart-badge" id="badge">0</span>
        </div>
        
        <img src="./images/image-avatar.png" alt="" class="avatar" />
      </section>
    </header>

    <!-- MAIN CONTENT -->
    <main class="site-main">
      <!-- LEFT CONTENT -->
      <section class="product-gallery">
        <div class="product-gallery__main">
          <img
            class="product-image1"
            id="main-img"
            src="./images/image-product-1.jpg"
            alt="Fall Limited Edition Sneakers"
          />
          <img
            class="product-image2"
            src="./images/image-product-2.jpg"
            alt="Fall Limited Edition Sneakers"
          />
          <img
            class="product-image3"
            src="./images/image-product-3.jpg"
            alt="Fall Limited Edition Sneakers"
          />
          <img
            class="product-image4"
            src="./images/image-product-4.jpg"
            alt="Fall Limited Edition Sneakers"
          />
        </div>

        <div class="product-gallery__thumbnails">
          <button class="thumbnail" type="button" onclick="imgsrc(1)">
            <img src="./images/image-product-1-thumbnail.jpg" class="thumbimg"  alt="" />
          </button>

          <button class="thumbnail" type="button" onclick="imgsrc(2)">
            <img src="./images/image-product-2-thumbnail.jpg" class="thumbimg"  alt="" />
          </button>

          <button class="thumbnail" type="button" onclick="imgsrc(3)">
            <img src="./images/image-product-3-thumbnail.jpg" class="thumbimg" alt="" />
          </button>

          <button class="thumbnail" type="button" onclick="imgsrc(4)">
            <img src="./images/image-product-4-thumbnail.jpg" class="thumbimg" alt="" />
          </button>
        </div>
      </section>
      <!-- RIGHT CONTENT -->

      <section class="sneaker-content">
        <section class="sneaker-information">
          <div class="sneaker-header">
            <p class="eye-opener">Sneaker Company</p>
            <h1 class="sneaker-info">Fall Limited Edition Sneakers</h1>
            <p class="sneaker-details">
              These low-profile sneakers are your perfect casual wear companion.
              Featuring a durable rubber outer sole, they’ll withstand
              everything the weather can offer.
            </p>
          </div>
          <section class="sneaker-prices">
            <div class="disc">
               <p class="discounted-price">$125.00</p>
            <p class="discount">50%</p>
            </div>
           

            <section class="sneaker-originprice">
              <p class="original-price">$250.00</p>
            </section>
          </section>
        </section>

        <section class="sneaker-cart">
          <div class="counter">
            <button
              type="button"
              
              onclick="decrease()"
              aria="decrease"
              class="btn"
            >
              -
            </button>
            <p class="counter-num" id="count-el">0</p>
            <button
              type="button"
              
              onclick="increment()"
              aria="increasment-button"
              class="btn"
            >
              +
            </button>
          </div>

          <div class="addcart-button" onclick="add()">
            <img src="./images/icon-cart.svg" alt="cart-icon" class="cart" width="15px" />
            
            <button type="submit" class="btn-add" id="addbtn" >  Add to cart</button>
          </div>
        </section>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
