<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | E-commerce product page</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-body">
    <header class="site-navigation">
      <!-- LEFT-NAVIGATION  -->
      <nav class="nav-lists">
        <div class="logo-toggle">
          <button
            type="button"
            class="nav-toggle"
            aria-label="Open Navigation"
            aria-expanded="false"
          >
            ☰
          </button>
          <img src="./images/logo.svg" class="logo"><img>
        </div>

        <ul class="list-items">
          <li><a href="#">Collections</a></li>
          <li><a href="#">Men</a></li>
          <li><a href="#">Women</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>
      <!-- RICHT-NAVIGATION  -->
      <section class="avatar-cart">
        <img src="./images/icon-cart.svg" class="cart-icon" width="15px" />
        <img src="./images/image-avatar.png" alt="" class="avatar" />
      </section>
    </header>

    <!-- MAIN CONTENT -->
    <main class="site-main">
      <!-- LEFT CONTENT -->
      <section class="product-gallery">
        <div class="product-gallery__main">
          <img
            class="product-image"
            src="./images/image-product-1.jpg"
            alt="Fall Limited Edition Sneakers"
          />
          <img
            class="product-image"
            src="./images/image-product-2.jpg"
            alt="Fall Limited Edition Sneakers"
          />
          <img
            class="product-image"
            src="./images/image-product-3.jpg"
            alt="Fall Limited Edition Sneakers"
          />
          <img
            class="product-image"
            src="./images/image-product-4.jpg"
            alt="Fall Limited Edition Sneakers"
          />
        </div>

        <div class="product-gallery__thumbnails">
          <button class="product-gallery__thumbnail">
            <img src="./images/image-product-1-thumbnail.jpg" alt="" />
          </button>

          <button class="product-gallery__thumbnail">
            <img src="./images/image-product-2-thumbnail.jpg" alt="" />
          </button>

          <button class="product-gallery__thumbnail">
            <img src="./images/image-product-3-thumbnail.jpg" alt="" />
          </button>

          <button class="product-gallery__thumbnail">
            <img src="./images/image-product-4-thumbnail.jpg" alt="" />
          </button>
        </div>
      </section>
      <!-- RIGHT CONTENT -->

      <section class="sneaker-content">
        <section class="sneaker-information">
          <div class="sneaker-header">
            <p class="eye-opener">Sneaker Company</p>
            <h1 class="sneaker-info">Fall Limited Edition Sneakers</h1>
            <p class="sneaker-details">
              These low-profile sneakers are your perfect casual wear companion.
              Featuring a durable rubber outer sole, they’ll withstand
              everything the weather can offer.
            </p>
          </div>
          <section class="sneaker-prices">
            <div class="disc">
               <p class="discounted-price">$125.00</p>
            <p class="discount">50%</p>
            </div>
           

            <section class="sneaker-originprice">
              <p class="original-price">$250.00</p>
            </section>
          </section>
        </section>

        <section class="sneaker-cart">
          <div class="counter">
            <button
              type="button"
              
              onclick="decrease()"
              aria="decrease"
              class="btn"
            >
              -
            </button>
            <p class="counter-num" id="count-el">0</p>
            <button
              type="button"
              
              onclick="increment()"
              aria="increasment-button"
              class="btn"
            >
              +
            </button>
          </div>

          <div class="addcart-button">
            <img src="./images/icon-cart.svg" alt="cart-icon" class="cart" width="15px" />
            
            <button type="submit" class="btn-add" id="addbtn" onclick="add()">  Add to cart</button>
          </div>
        </section>
      </section>
    </main>
    <script src="index.js"></script>
  </body>
</html>
