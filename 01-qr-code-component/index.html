<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | QR code component</title>
</head>
<body>
<main class="container">
  <div class="img-container">
    <img src="./images/image-qr-code.png" alt="An image of a qr-code">
  </div>
  <div class="content-container">
    <h1 class="content-header">Improve your front-end skills by building projects</h1>
    <p class="content-detail">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
</main>
  

  
</body>
</html>
